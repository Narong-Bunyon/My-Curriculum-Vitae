# =============================================================
# Custom Nginx Configuration
# =============================================================
# This tells Nginx HOW to serve your website files.
# Without this, Nginx uses defaults that may not handle
# your site's routing correctly (e.g. /pages/about/about.html).
# =============================================================

server {
    # Listen on port 80 (HTTP)
    listen 80;
    server_name localhost;

    # Root directory where your website files are stored
    root /usr/share/nginx/html;

    # Default file to serve when visiting a directory
    index index.html;

    # --- Main location block ---
    # try_files tries to find the requested file:
    #   1. Exact match ($uri)
    #   2. As a directory ($uri/)
    #   3. Fall back to 404 if not found
    location / {
        try_files $uri $uri/ =404;
    }

    # --- Cache static assets for better performance ---
    # Browsers will cache images, CSS, and JS for 30 days
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # --- Enable Gzip compression for faster loading ---
    gzip on;
    gzip_types text/plain text/css application/javascript text/html;
    gzip_min_length 256;

    # --- Custom error page ---
    error_page 404 /index.html;

    # --- Security: deny access to hidden files (.git, .env, etc.) ---
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
