# =============================================================
# Docker Compose - Easy way to manage your container
# =============================================================
# Instead of typing long `docker run` commands, just use:
#
#   docker compose up -d        → Start the website
#   docker compose down         → Stop the website
#   docker compose up --build   → Rebuild & restart after changes
#   docker compose logs -f      → View live logs
#
# =============================================================

services:
  portfolio:
    # Build from the Dockerfile in this directory
    build: .

    # Map port 8080 on your machine → port 80 in the container
    ports:
      - "8080:80"

    # Container name (easier to reference)
    container_name: narong-portfolio

    # Always restart unless you manually stop it
    restart: unless-stopped

    # Add health check to monitor if the site is running
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
